; Loupe glasses firmware: Seeed Studio XIAO ESP32S3 Sense (OV2640/OV3660 camera, 8 MB PSRAM)
;
; Flash:    pio run -t upload        (or the PlatformIO sidebar in Antigravity / VS Code)
; Monitor:  pio device monitor
; Credentials are NOT compiled in. The desktop app writes them over USB after flashing.

[env:xiao_esp32s3_sense]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
